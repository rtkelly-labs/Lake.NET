[project]
name = "iceberg-net-interop"
version = "0.0.0"
description = "Reference implementations (PyIceberg, moto) used by the .NET Iceberg port's interop and emulation tests"
requires-python = ">=3.12"
dependencies = [
  "pyiceberg[pyarrow,glue,sql-sqlite,pyiceberg-core,s3fs]==0.12.0",
  "moto[server]==5.2.4",
  "datasketches==5.2.0",
  "pyroaring==1.2.0",
]

[tool.uv]
package = false

[dependency-groups]
# interop/duckdb_oracle.py (DuckDB's iceberg extension as an oracle) and interop/ducklake_oracle.py (DuckDB's ducklake
# extension, the DuckLake reference implementation): `uv sync --project interop --group duckdb`.
# The iceberg extension is downloaded by DuckDB on first use; offline, also install duckdb-extension-iceberg and
# duckdb-extension-avro at the same version (see docs/spark-and-athena.md). The DuckLake oracle's extensions are pinned
# here as wheels (DuckDB's signed builds, still verified on LOAD), so it also runs where extensions.duckdb.org is blocked.
duckdb = [
  "duckdb==1.5.5",
  "duckdb-extensions==1.5.5",
  "duckdb-extension-ducklake==1.5.5",
  "duckdb-extension-sqlite-scanner==1.5.5",
  "duckdb-extension-postgres-scanner==1.5.5",
  "duckdb-extension-parquet==1.5.5",
  # DuckDB's Python client imports pytz to return TIMESTAMP WITH TIME ZONE values (the DuckLake oracle reads them).
  "pytz==2025.2",
]
