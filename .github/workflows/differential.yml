name: differential

# Differential campaign against PyIceberg (and, for .NET-written tables, DuckDB) on generated schemas and rows
# (tests/Iceberg.Net.Regression.Tests/GeneratedDifferentialTests.cs). Not a required check: it runs weekly, on demand, and on
# pull requests that change the campaign or the oracle. A disagreement fails the job; the shrunk tables and
# summary.json are uploaded either way. The weekly run starts at a new seed each time (run number × 100000, well past
# the ~2500 cases a run generates), so it explores cases no earlier run has; a dispatch with that seed replays it.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of generation per direction
        default: "900"
      seed:
        description: First seed (cases use seed, seed+1, ...)
        default: "1"
  pull_request:
    paths:
      - tests/Iceberg.Net.Regression.Tests/GeneratedDifferentialTests.cs
      - interop/pyiceberg_oracle.py
      - src/Iceberg.Net.Data/TableFingerprint.cs
      - .github/workflows/differential.yml

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - direction: dotnet-writes
            filter: FullyQualifiedName~GeneratedDifferentialTests.Generated_tables_written_by_dotnet
          - direction: pyiceberg-writes
            filter: FullyQualifiedName~GeneratedDifferentialTests.Generated_tables_written_by_pyiceberg
    env:
      # Pull requests get a short smoke run (the path filter matches the PR's whole diff, so every push re-runs it).
      ICEBERG_DIFFERENTIAL_SECONDS: ${{ inputs.seconds || (github.event_name == 'schedule' && '900') || '120' }}
      ICEBERG_DIFFERENTIAL_OUT: ${{ github.workspace }}/differential-out
      ICEBERG_PYTHON: ${{ github.workspace }}/interop/.venv/bin/python
      # The second oracle for .NET-written tables (its iceberg extension downloads from extensions.duckdb.org).
      # Weekly and dispatched runs only: it costs 2.4x per case, which would halve the cases a 120 s PR run covers.
      # Dispatch on the branch to check a change to duckdb_oracle.py.
      ICEBERG_DIFFERENTIAL_DUCKDB: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install PyIceberg and DuckDB oracles
        run: uv sync --project interop --group duckdb
      - name: Seed
        env:
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          seed=${SEED_INPUT:-1}
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then seed=$((GITHUB_RUN_NUMBER * 100000)); fi
          echo "ICEBERG_DIFFERENTIAL_SEED=$seed" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build tests/Iceberg.Net.Regression.Tests -c Release --nologo -v quiet
      - name: Campaign (${{ matrix.direction }})
        run: >-
          dotnet test tests/Iceberg.Net.Regression.Tests -c Release --no-build --nologo
          --filter "${{ matrix.filter }}" --logger "console;verbosity=detailed"
      - name: Summary
        if: always()
        run: |
          f="$ICEBERG_DIFFERENTIAL_OUT/${{ matrix.direction }}/summary.json"
          echo "First seed $ICEBERG_DIFFERENTIAL_SEED, $ICEBERG_DIFFERENTIAL_SECONDS s" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$f" ]; then
            { echo '### ${{ matrix.direction }}'; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: differential-${{ matrix.direction }}
          path: differential-out
          if-no-files-found: ignore
