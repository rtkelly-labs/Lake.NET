name: fuzz

# Weekly coverage-guided fuzzing (SharpFuzz + libFuzzer) of the decoders for untrusted bytes
# (see docs/regression-suite.md, "Fuzzing"). A finding fails its job and uploads the input.
on:
  # Weekly (docs/lake/goal.md, G7 and G10); 900 s per target when scheduled.
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "900"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [metadata, view-metadata, manifest-list, manifest, puffin, deletion-vector, roaring, theta, mumbling]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: libFuzzer runtime
        run: sudo apt-get update -q && sudo apt-get install -y -q clang libclang-rt-18-dev
      - name: Fuzz ${{ matrix.target }}
        run: tools/fuzz.sh ${{ matrix.target }} ${{ inputs.seconds || '900' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/${{ matrix.target }}/findings
          if-no-files-found: ignore
