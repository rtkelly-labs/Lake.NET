name: ci

# AWS-mode runs are manual (workflow_dispatch) because they
# need credentials and cost money; see docs/regression-suite.md.
on:
  pull_request:
  # A merge queue runs the required `ci` check on the queued merge commit before it lands.
  # Every job feeding `ci` must run for this event too, or the queue waits on a check that never reports.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Test projects are listed once: Iceberg.Net.slnx, each grouped into a job by its <CiSuite> property
  # (tools/test-projects.sh fails on a test project with no suite, so none is skipped by accident).

  # No Docker or Python oracles: the L0 spec tests, the typed and EF layers, the in-process REST catalog
  # behaviour specs, the package smoke test and the spec traceability matrix.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true  # external/parquet-dotnet (the Parquet.Net backend)

      - name: Lint file extensions and naming conventions
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2
        with:
          warn: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # The SDK comes from global.json (setup-dotnet above).
      - name: CHANGELOG.md is well formed (the release reads its version from it)
        run: dotnet run scripts/ParseChangelog.cs

      # Generated, not committed: the matrix is published as an artifact. --check fails on a link to a
      # section that does not exist in the pinned upstream spec.
      - name: Spec traceability matrix (fails on links to unknown sections)
        run: python3 tools/spec_trace.py matrix --check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('docs/spec-traceability.md') != '' }}
        with:
          name: spec-traceability
          path: docs/spec-traceability.md
          retention-days: 30

      - name: Unit suite (spec, netstandard2.0, LINQ, EF Core, REST catalog behaviour)
        run: ./tools/test-projects.sh test unit

      - name: Pack the libraries and smoke-test the packages
        run: ./tools/package-smoke.sh "$RUNNER_TEMP/nupkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iceberg-dotnet-packages
          path: ${{ runner.temp }}/nupkg/*.nupkg
          retention-days: 14

  # Other engines as oracles, with every emulator up: telemetry, Spark procedure SQL (run end to end in the
  # Spark oracle image), the EMR Serverless / Glue / Athena clients against faked SDKs, DuckDB's iceberg
  # extension (downloaded from extensions.duckdb.org here, so a load failure fails instead of skipping), the BDD
  # specification, and the REST catalog server with PyIceberg and Spark against it.
  cross-engine:
    name: cross-engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true  # external/parquet-dotnet (the Parquet.Net backend)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      # The full set in both Docker-backed jobs: a missing engine or REST server is a skip, not a failure.
      - name: Start emulators (moto, REST fixture, Polaris, Trino, Gravitino, Nessie, Lakekeeper) and fetch the Spark oracle
        run: ./emulation/up.sh --spark --trino --polaris --gravitino --nessie --lakekeeper

      - name: Install PyIceberg and DuckDB oracles
        run: uv sync --project interop --group duckdb

      # DuckLake 1.1 is written by DuckDB 2.0, whose ducklake extension is not on PyPI: it downloads from
      # extensions.duckdb.org on first use (interop/ducklake_oracle.py). The 1.0 oracle is DuckDB 1.5 in the group above.
      - name: Install the DuckLake 1.1 oracle (DuckDB 2.0)
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/ducklake11"
          uv pip install --python "$RUNNER_TEMP/ducklake11/bin/python" duckdb==2.0.0 pytz

      - name: Cross-engine suite (ecosystem, BDD specifications, REST catalog server, DuckLake)
        env:
          ICEBERG_PYTHON: ${{ github.workspace }}/interop/.venv/bin/python
          ICEBERG_DUCKDB_REQUIRED: "1"
          # RestServer.Tests copies its own interop/ into the output directory, which the repository
          # lookup can mistake for the root. Use the runtime fetched by emulation/up.sh --spark.
          ICEBERG_SPARK_JAR: ${{ github.workspace }}/emulation/.cache/iceberg-spark-runtime-4.0_2.13-1.12.0.jar
          ICEBERG_DUCKLAKE11_PYTHON: ${{ runner.temp }}/ducklake11/bin/python
          ICEBERG_DUCKLAKE11_REQUIRED: "1"
          ICEBERG_DUCKLAKE_POSTGRES: Host=localhost;Port=5434;Username=postgres;Password=postgres
          ICEBERG_DUCKLAKE_POSTGRES_REQUIRED: "1"
        run: ./tools/test-projects.sh test cross-engine

      - name: Emulator logs on failure
        if: failure()
        run: docker compose -f emulation/docker-compose.yml --profile trino --profile polaris --profile gravitino --profile nessie --profile lakekeeper logs --tail 200

  # Fails rather than skips when an emulator is unreachable: every REST operation and the error contract
  # against the emulated REST servers (Java reference, Polaris, Nessie, Lakekeeper, Gravitino), and the
  # L1/L2 regression suite.
  regression:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true  # external/parquet-dotnet (the Parquet.Net backend)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Start emulators (moto, REST fixture, Polaris, Trino, Gravitino, Nessie, Lakekeeper) and fetch the Spark oracle
        run: ./emulation/up.sh --spark --trino --polaris --gravitino --nessie --lakekeeper

      - name: Install PyIceberg oracle
        run: uv sync --project interop

      - name: Regression suite (REST protocol, L1/L2 regression against the emulators)
        env:
          ICEBERG_TEST_TARGET: emulation
          ICEBERG_REQUIRE_TARGET: "1"
          ICEBERG_PYTHON: ${{ github.workspace }}/interop/.venv/bin/python
        run: ./tools/test-projects.sh test regression --logger "console;verbosity=normal"

      - name: Emulator logs on failure
        if: failure()
        run: docker compose -f emulation/docker-compose.yml --profile trino --profile polaris --profile gravitino --profile nessie --profile lakekeeper logs --tail 200

  # The same suites on the other Parquet library: Iceberg.Net.Data reads and writes every file through Parquet.Net
  # (external/parquet-dotnet) instead of ParquetSharp. The unit suite, and DuckLake with DuckDB 1.5 and 2.0 reading
  # the files these write (and writing the files these read), on SQLite and PostgreSQL catalogs.
  parquet-net:
    name: parquet-net
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ICEBERG_PARQUET_BACKEND: parquet-net
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true  # external/parquet-dotnet (the Parquet.Net backend)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Start PostgreSQL for DuckLake catalogs
        run: docker compose -f emulation/docker-compose.yml up -d --wait ducklake-db

      - name: Install the DuckDB oracles (DuckLake 1.0 and 1.1)
        run: |
          uv sync --project interop --group duckdb
          uv venv --python 3.12 "$RUNNER_TEMP/ducklake11"
          uv pip install --python "$RUNNER_TEMP/ducklake11/bin/python" duckdb==2.0.0 pytz

      - name: Unit suite on Parquet.Net
        run: ./tools/test-projects.sh test unit

      - name: DuckLake suites on Parquet.Net
        env:
          ICEBERG_DUCKDB_PYTHON: ${{ github.workspace }}/interop/.venv/bin/python
          ICEBERG_DUCKDB_REQUIRED: "1"
          ICEBERG_DUCKLAKE11_PYTHON: ${{ runner.temp }}/ducklake11/bin/python
          ICEBERG_DUCKLAKE11_REQUIRED: "1"
          ICEBERG_DUCKLAKE_POSTGRES: Host=localhost;Port=5434;Username=postgres;Password=postgres
          ICEBERG_DUCKLAKE_POSTGRES_REQUIRED: "1"
        run: |
          dotnet test tests/Iceberg.Net.DuckLake.Tests --nologo
          dotnet test tests/Iceberg.Net.DuckLake.Behaviour.Tests --nologo

  # The Parquet.Net fork's own suite (net8.0 and net10.0) on every OS: the fork's repository has no Actions of its own.
  # Not part of the required `ci` check: it reports, but a platform quirk in an upstream test must not block merges.
  parquet-net-fork:
    name: parquet-net-fork (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true  # external/parquet-dotnet (the Parquet.Net backend)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      # One test reads a file back with pyarrow (python3 on the PATH).
      - name: pyarrow for the Arrow interop test
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/pyarrow"
          uv pip install --python "$RUNNER_TEMP/pyarrow" pyarrow pandas
          if [ "$RUNNER_OS" = "Windows" ]; then
            # the test runs python3.exe; a Windows venv may only have python.exe
            [ -f "$RUNNER_TEMP/pyarrow/Scripts/python3.exe" ] || cp "$RUNNER_TEMP/pyarrow/Scripts/python.exe" "$RUNNER_TEMP/pyarrow/Scripts/python3.exe"
            echo "$RUNNER_TEMP/pyarrow/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/pyarrow/bin" >> "$GITHUB_PATH"
          fi
      - name: Parquet.Net fork tests
        run: dotnet test external/parquet-dotnet/src/Parquet.Test --nologo

  # The one required check. Branch protection matches on this name, so it stays `ci` whatever
  # the jobs above are called or however they are split.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [unit, cross-engine, regression, parquet-net]
    # `always()`, so this reports a verdict when a job fails rather than being skipped: a skipped
    # required check is indistinguishable from one still running, and blocks the PR either way.
    if: always()
    timeout-minutes: 5
    permissions: {}
    steps:
      # Every job in `needs` is judged from the one JSON object, so adding a job to `needs` is the whole change.
      - name: Report the verdict of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          [ "$(jq length <<<"${NEEDS}")" -gt 0 ] || { echo "::error::no jobs to judge"; exit 1; }
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"${NEEDS}" | {
            failed=0
            while read -r job result; do
              if [ "${result}" = "success" ]; then
                echo "✅ ${job}: ${result}"
              else
                echo "::error::${job} did not succeed (${result})"
                failed=1
              fi
            done
            exit "${failed}"
          }
