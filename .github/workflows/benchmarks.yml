name: benchmarks

# Weekly micro benchmarks (benchmarks/Lake.Benchmarks.Micro): time and allocations per call for the deletion-vector
# codec, metadata JSON and Parquet write/scan. GitHub-hosted runners are too noisy to gate on time, so this publishes
# results for the trend (docs/lake/verification/benchmarks.md); the exact gate is RequestBudgetTests in the unit suite.
on:
  schedule:
    - cron: "11 4 * * 3"
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet filter
        default: "*"

permissions:
  contents: read

jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Run
        working-directory: benchmarks/Lake.Benchmarks.Micro
        env:
          FILTER: ${{ inputs.filter || '*' }}
        run: dotnet run -c Release -- --filter "$FILTER" --exporters json markdown
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat benchmarks/Lake.Benchmarks.Micro/BenchmarkDotNet.Artifacts/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmarks-${{ github.run_id }}
          path: benchmarks/Lake.Benchmarks.Micro/BenchmarkDotNet.Artifacts/results
          retention-days: 90
