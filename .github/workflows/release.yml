name: release

# CHANGELOG.md is the release authority: scripts/ParseChangelog.cs reads the version and release notes from the first
# cut version section (`## [x.y.z] - YYYY-MM-DD`). To release, merge a PR that moves [Unreleased] under such a heading,
# then dispatch this workflow. There is deliberately no version input: a version the changelog does not describe cannot
# be published.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test, pack and verify only: no NuGet push, no GitHub release. Untick to publish for real.'
        required: false
        type: boolean
        # A real publish needs an explicit false: an unmodified dispatch is a dry run.
        default: true

# Least privilege: only `publish`, which exchanges the OIDC token at nuget.org, gets more than read. `build` runs repo
# code (MSBuild, tests, scripts), so it never holds id-token: write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the release from the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      is_prerelease: ${{ steps.changelog.outputs.is_prerelease }}
    steps:
      # The changelog cut is merged to main, so main is the only ref a real release can describe. A dry run may build any
      # ref.
      - name: Refuse a real release from anything but main
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real release may only be dispatched from main; got '$GITHUB_REF'. Merge the changelog cut first, or dispatch a dry run."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Parse the changelog (release mode)
        id: changelog
        run: dotnet run scripts/ParseChangelog.cs --release --notes-out "$RUNNER_TEMP/release-notes.md" --github-output "$GITHUB_OUTPUT"

      - name: Refuse to re-release an existing tag
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists: that version is released. Cut a new version section instead."
            exit 1
          fi

      # Every release commits golden tables written by itself, so later versions are tested reading them
      # (OwnGoldenFixtureTests; docs/lake/goal.md G3). Write them before cutting the changelog section:
      # LAKE_WRITE_GOLDEN=<version> dotnet test tests/Iceberg.Net.Spec.Tests --filter OwnGoldenFixtureTests.Write
      - name: Require golden tables written by this version
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ ! -f "tests/Iceberg.Net.Spec.Tests/fixtures/lake-net/$VERSION/expected.json" ]; then
            msg="No golden tables for $VERSION in tests/Iceberg.Net.Spec.Tests/fixtures/lake-net/$VERSION"
            if [ "$DRY_RUN" = "false" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg (dry run: a real release would stop here)"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    name: Build, test and pack
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build (Release)
        run: dotnet build Iceberg.Net.slnx -c Release -p:Version="$VERSION" --nologo

      # The emulator, cross-engine and REST suites run in CI on this commit (checked by verify-ci); these are the fast
      # tiers over the exact Release build that is packed.
      - name: Unit suite (spec, netstandard2.0, LINQ, EF Core, REST catalog behaviour)
        run: ./tools/test-projects.sh test unit -c Release --no-build

      - name: Pack
        run: dotnet pack Iceberg.Net.slnx -c Release --no-build -p:Version="$VERSION" -o "$RUNNER_TEMP/nupkg" --nologo

      # Consumes the packages from a local feed (and checks exactly the released set is packed).
      - name: Package smoke test
        run: ./tools/package-smoke.sh "$RUNNER_TEMP/smoke"

      - name: The packages carry the released version
        run: |
          set -euo pipefail
          count=$(ls "$RUNNER_TEMP"/nupkg/*."$VERSION".nupkg | wc -l)
          echo "$count packages at $VERSION"
          [ "$count" -eq 7 ] || { ls "$RUNNER_TEMP/nupkg"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            ${{ runner.temp }}/nupkg/*.nupkg
            ${{ runner.temp }}/nupkg/*.snupkg
          if-no-files-found: error

  # The release build skips the emulator and cross-engine tiers, so a release is only as good as the `ci` check CI
  # recorded for this exact commit. On a dry run the verdict is reported without failing.
  verify-ci:
    name: Verify the commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Require a successful ci check run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          json=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci&filter=latest&per_page=100")
          found=$(jq '[.check_runs[] | select(.app.slug == "github-actions")] | length' <<<"$json")
          bad=$(jq '[.check_runs[] | select(.app.slug == "github-actions") | select(.status != "completed" or .conclusion != "success")] | length' <<<"$json")
          echo "ci check runs for $GITHUB_SHA: found=$found not-successful=$bad"
          problem=""
          if [ "$found" -eq 0 ]; then problem="no 'ci' check run exists for $GITHUB_SHA"; fi
          if [ "$found" -gt 0 ] && [ "$bad" -ne 0 ]; then problem="the 'ci' check run for $GITHUB_SHA is pending or did not succeed"; fi
          if [ -z "$problem" ]; then
            echo "The ci check run succeeded."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::$problem (dry run: a real release would stop here)"
          else
            echo "::error::$problem. Release a commit that has passed CI."
            exit 1
          fi

  publish:
    name: Publish to NuGet
    needs: [prepare, build, verify-ci]
    # Repeats the check in `prepare` as a structural brake: the push can only run against main.
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and, for full versions, the GitHub release
      id-token: write # NuGet/login exchanges the OIDC token (trusted publishing)
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ./release-notes

      - name: Log in to NuGet (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'rtk_13' }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag the release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      # Prereleases go to nuget.org only; the GitHub releases page lists versions people should adopt.
      - name: Create the GitHub release
        if: ${{ needs.prepare.outputs.is_prerelease == 'false' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ./release-notes/release-notes.md
          files: ./artifacts/*.nupkg
