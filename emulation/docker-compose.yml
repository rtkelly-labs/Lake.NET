# Full-emulation stack for the regression suite. See ../docs/regression-suite.md.
# Image tags are pinned; MOTO_TAG / REST_FIXTURE_TAG / TRINO_TAG / POLARIS_TAG / GRAVITINO_TAG override them (the weekly upkeep workflow runs
# the suite against :latest to catch upstream drift before a pin bump). MOTO_PORT moves moto's host port off 5000
# (macOS AirPlay holds it); containers still reach moto as moto:5000, and the test host reads MOTO_PORT too.
#   moto  - AWS emulator: S3 (incl. conditional writes) + Glue Data Catalog + STS, one endpoint,
#           started through moto_server.py so the Glue fidelity shims (docs/emulation.md) apply
#   rest  - apache/iceberg-rest-fixture: the Iceberg project's own REST catalog test server
#           (Java reference implementation, JDBC-backed) storing metadata in moto's S3
#   polaris - (profile "polaris": ./up.sh --polaris) Apache Polaris, a second, independently implemented REST
#           catalog server (in-memory persistence, S3 storage on moto, no credential vending)
#   gravitino - (profile "gravitino": ./up.sh --gravitino) Apache Gravitino's Iceberg REST server, a third REST server
#           (Gravitino's own service over Iceberg 1.11's catalog code; SQLite JDBC backend, S3FileIO on moto)
#   nessie - (profile "nessie": ./up.sh --nessie) Project Nessie's Iceberg REST API, a fourth REST server. Its images
#           are on ghcr.io/quay.io, so the release jar from Maven Central (fetched by up.sh into .cache/) runs on the
#           JDK of the Polaris image; in-memory version store, S3 on moto, no request signing (clients bring credentials)
#   lakekeeper - (profile "lakekeeper": ./up.sh --lakekeeper) Lakekeeper, a fifth REST server and the only one not on
#           the Java catalog code (Rust, on iceberg-rust); Postgres-backed, S3 on moto without STS. Its images are on
#           quay.io; LAKEKEEPER_IMAGE points at a locally built one (./lakekeeper_image.sh) where quay.io is unreachable
#   trino - (profile "trino": ./up.sh --trino) Trino's Iceberg connector over the same REST catalog + S3,
#           a third independent reader (Java, but not the Iceberg core library's scan planner)
#   ducklake-db - PostgreSQL for DuckLake catalogs (Iceberg.Net.DuckLake tests: one database per test, created and
#           dropped by the tests; DuckDB's ducklake extension attaches the same databases). Reached as
#           ICEBERG_DUCKLAKE_POSTGRES=Host=localhost;Port=5434;Username=postgres;Password=postgres
name: iceberg-dotnet-emulation
services:
  ducklake-db:
    image: postgres:${DUCKLAKE_PG_TAG:-17}
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5434:5432"]
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  moto:
    image: motoserver/moto:${MOTO_TAG:-5.2.4}
    ports: ["${MOTO_PORT:-5000}:5000"]
    volumes: ["./moto_server.py:/shim/moto_server.py:ro"]
    entrypoint: ["python", "-I", "/shim/moto_server.py", "--port", "5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      retries: 30

  bucket:
    image: motoserver/moto:${MOTO_TAG:-5.2.4}
    depends_on:
      moto: { condition: service_healthy }
    # Idempotent: moto may already hold the bucket when the stack is restarted.
    entrypoint: ["python", "-c", "import boto3; s3 = boto3.client('s3', endpoint_url='http://moto:5000', region_name='eu-west-1', aws_access_key_id='test', aws_secret_access_key='test'); s3.head_bucket(Bucket='iceberg-regression') if 'iceberg-regression' in [b['Name'] for b in s3.list_buckets()['Buckets']] else s3.create_bucket(Bucket='iceberg-regression', CreateBucketConfiguration={'LocationConstraint': 'eu-west-1'})"]

  rest:
    image: apache/iceberg-rest-fixture:${REST_FIXTURE_TAG:-1.10.0}
    depends_on:
      bucket: { condition: service_completed_successfully }
    ports: ["8181:8181"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      CATALOG_WAREHOUSE: s3://iceberg-regression/rest-warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://moto:5000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # The fixture's default in-memory SQLite fails concurrent commits with SQLITE_BUSY (HTTP 500), which the
      # soak tests surfaced. A file database with WAL and a busy timeout serialises writers instead.
      CATALOG_URI: "jdbc:sqlite:/tmp/rest-catalog.db?journal_mode=WAL&busy_timeout=30000"

  trino:
    image: trinodb/trino:${TRINO_TAG:-478}
    profiles: ["trino"]
    depends_on:
      rest: { condition: service_started }
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info/state"]
      interval: 3s
      retries: 60

  polaris:
    image: apache/polaris:${POLARIS_TAG:-1.8.0}
    profiles: ["polaris"]
    depends_on:
      bucket: { condition: service_completed_successfully }
    ports: ["8182:8181", "8183:8182"]
    environment:
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 3s
      retries: 60

  gravitino:
    image: apache/gravitino-iceberg-rest:${GRAVITINO_TAG:-1.3.1}
    profiles: ["gravitino"]
    depends_on:
      bucket: { condition: service_completed_successfully }
    ports: ["9001:9001"]
    # The memory backend keeps files in an in-memory FileIO (the server could not read our S3 files to plan scans or
    # purge), so a JDBC backend on the bundled SQLite driver, initialised on start.
    entrypoint: ["bash", "-c", "echo 'gravitino.iceberg-rest.jdbc-initialize = true' >> conf/gravitino-iceberg-rest-server.conf && exec bin/start-iceberg-rest-server.sh"]
    environment:
      GRAVITINO_ICEBERG_REST_CATALOG_BACKEND: jdbc
      GRAVITINO_ICEBERG_REST_URI: jdbc:sqlite:/tmp/gravitino-catalog.db
      GRAVITINO_ICEBERG_REST_JDBC_DRIVER: org.sqlite.JDBC
      GRAVITINO_ICEBERG_REST_JDBC_USER: iceberg
      GRAVITINO_ICEBERG_REST_JDBC_PASSWORD: iceberg
      GRAVITINO_ICEBERG_REST_WAREHOUSE: s3://iceberg-regression/gravitino
      GRAVITINO_ICEBERG_REST_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
      GRAVITINO_ICEBERG_REST_S3_ENDPOINT: http://moto:5000
      GRAVITINO_ICEBERG_REST_S3_REGION: eu-west-1
      GRAVITINO_ICEBERG_REST_S3_PATH_STYLE_ACCESS: "true"
      GRAVITINO_ICEBERG_REST_S3_ACCESS_KEY: test
      GRAVITINO_ICEBERG_REST_S3_SECRET_KEY: test
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9001 && printf 'GET /iceberg/v1/config HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 3s
      retries: 60

  nessie:
    image: apache/polaris:${POLARIS_TAG:-1.8.0}
    profiles: ["nessie"]
    depends_on:
      bucket: { condition: service_completed_successfully }
    ports: ["19120:19120"]
    volumes: ["./.cache:/jars:ro"]
    entrypoint:
      - java
      - -Dnessie.version.store.type=IN_MEMORY
      - -Dnessie.catalog.default-warehouse=warehouse
      - -Dnessie.catalog.warehouses.warehouse.location=s3://iceberg-regression/nessie
      - -Dnessie.catalog.service.s3.default-options.endpoint=http://moto:5000
      - -Dnessie.catalog.service.s3.default-options.external-endpoint=http://localhost:${MOTO_PORT:-5000}
      - -Dnessie.catalog.service.s3.default-options.path-style-access=true
      - -Dnessie.catalog.service.s3.default-options.region=eu-west-1
      - -Dnessie.catalog.service.s3.default-options.request-signing-enabled=false
      - -Dnessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:s3key
      - -Ds3key.name=test
      - -Ds3key.secret=test
      - -Dquarkus.otel.sdk.disabled=true
      - -jar
      - /jars/nessie-quarkus-${NESSIE_VERSION:-0.109.0}-runner.jar
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19120/iceberg/v1/config"]
      interval: 3s
      retries: 60

  # Lakekeeper shares the host network: its warehouse has one S3 endpoint for itself and for clients, and only
  # localhost:$MOTO_PORT (default 5000) reaches moto from both. Ports are moved off the fixture's 8181 and Gravitino's metrics range.
  lakekeeper-db:
    image: postgres:${LAKEKEEPER_PG_TAG:-17}
    profiles: ["lakekeeper"]
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  lakekeeper-migrate:
    image: ${LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.14.1}
    profiles: ["lakekeeper"]
    network_mode: host
    depends_on:
      lakekeeper-db: { condition: service_healthy }
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@localhost:5433/postgres
      LAKEKEEPER__PG_ENCRYPTION_KEY: regression-only-not-a-secret
      LAKEKEEPER__LISTEN_PORT: "8283"
      LAKEKEEPER__METRICS__PORT: "9093"
      RUST_LOG: info
    command: ["migrate"]
    restart: "no"

  lakekeeper:
    image: ${LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.14.1}
    profiles: ["lakekeeper"]
    network_mode: host
    depends_on:
      lakekeeper-migrate: { condition: service_completed_successfully }
      bucket: { condition: service_completed_successfully }
    environment: *lakekeeper-env
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      retries: 30

  lakekeeper-setup:
    image: motoserver/moto:${MOTO_TAG:-5.2.4}
    profiles: ["lakekeeper"]
    network_mode: host
    depends_on:
      lakekeeper: { condition: service_healthy }
    volumes: ["./lakekeeper_setup.py:/setup/lakekeeper_setup.py:ro"]
    environment: { MOTO_PORT: "${MOTO_PORT:-5000}" }
    entrypoint: ["python", "-I", "/setup/lakekeeper_setup.py"]
    restart: "no"

  polaris-setup:
    image: motoserver/moto:${MOTO_TAG:-5.2.4}
    profiles: ["polaris"]
    depends_on:
      polaris: { condition: service_healthy }
    volumes: ["./polaris_setup.py:/setup/polaris_setup.py:ro"]
    environment: { MOTO_PORT: "${MOTO_PORT:-5000}" }
    entrypoint: ["python", "-I", "/setup/polaris_setup.py"]
